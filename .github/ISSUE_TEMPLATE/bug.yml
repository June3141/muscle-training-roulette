name: バグ報告
description: 動作しない・落ちる・表示が壊れている
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: 何が起きたか
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 再現手順
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した動作
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 環境
      placeholder: "ブラウザ / OS、または Node のバージョン"
